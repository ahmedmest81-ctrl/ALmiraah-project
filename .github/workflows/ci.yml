name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy scipy scikit-learn ruff
      - name: Lint service and tests
        run: ruff check engine/tool_service.py engine/run_local.py tests
      - name: Compile engine
        run: python -m compileall -q engine
      - name: Unit tests
        run: python -m unittest discover -s tests -v
